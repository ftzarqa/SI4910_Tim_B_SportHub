<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="futsal" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" />
  <g transform="translate(200, 140)">
    <!-- Shadow -->
    <ellipse cx="0" cy="95" rx="80" ry="14" fill="#0C2340" opacity="0.15" />
    <!-- Ball body -->
    <circle cx="0" cy="0" r="82" fill="url(#futsal)" stroke="#0C2340" stroke-width="3" />
    <!-- Center pentagon -->
    <polygon points="0,-28 26,-9 16,22 -16,22 -26,-9" fill="#0C2340" stroke="#009B5D" stroke-width="2.5" />
    <!-- Seams connecting from center pentagon -->
    <line x1="0" y1="-28" x2="0" y2="-55" stroke="#334155" stroke-width="2.5" />
    <line x1="26" y1="-9" x2="52" y2="-18" stroke="#334155" stroke-width="2.5" />
    <line x1="16" y1="22" x2="38" y2="48" stroke="#334155" stroke-width="2.5" />
    <line x1="-16" y1="22" x2="-38" y2="48" stroke="#334155" stroke-width="2.5" />
    <line x1="-26" y1="-9" x2="-52" y2="-18" stroke="#334155" stroke-width="2.5" />
    <!-- Outer patches -->
    <polygon points="0,-55 -32,-70 -48,-55 -26,-9" fill="#009B5D" opacity="0.9" stroke="#334155" stroke-width="2" />
    <polygon points="0,-55 32,-70 48,-55 26,-9" fill="#0C2340" stroke="#334155" stroke-width="2" />
    <polygon points="52,-18 78,0 65,30 38,48 16,22" fill="#009B5D" opacity="0.9" stroke="#334155" stroke-width="2" />
    <polygon points="-52,-18 -78,0 -65,30 -38,48 -16,22" fill="#0C2340" stroke="#334155" stroke-width="2" />
    <polygon points="-38,48 -20,75 20,75 38,48 0,38" fill="#009B5D" opacity="0.85" stroke="#334155" stroke-width="2" />
    <!-- Subtle shine -->
    <ellipse cx="-28" cy="-35" rx="25" ry="12" transform="rotate(-30, -28, -35)" fill="#FFFFFF" opacity="0.4" />
  </g>
  <text x="20" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0C2340" letter-spacing="1">SPECS ELYSIUM</text>
  <text x="380" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#009B5D" text-anchor="end">FUTSAL</text>
</svg>
