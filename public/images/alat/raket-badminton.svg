<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009B5D" />
      <stop offset="100%" stop-color="#0C2340" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" />
  <g transform="translate(200, 150) rotate(-45)">
    <!-- Racket Head Frame -->
    <ellipse cx="0" cy="-60" rx="42" ry="54" fill="none" stroke="url(#frame)" stroke-width="7" />
    <!-- Strings -->
    <g stroke="#94A3B8" stroke-width="1.2" opacity="0.6">
      <line x1="-30" y1="-75" x2="30" y2="-75" />
      <line x1="-38" y1="-60" x2="38" y2="-60" />
      <line x1="-35" y1="-45" x2="35" y2="-45" />
      <line x1="-26" y1="-30" x2="26" y2="-30" />
      <line x1="-20" y1="-100" x2="-20" y2="-20" />
      <line x1="-10" y1="-108" x2="-10" y2="-12" />
      <line x1="0" y1="-110" x2="0" y2="-10" />
      <line x1="10" y1="-108" x2="10" y2="-12" />
      <line x1="20" y1="-100" x2="20" y2="-20" />
    </g>
    <!-- Throat -->
    <path d="M -12 -8 L 0 5 L 12 -8" fill="none" stroke="url(#frame)" stroke-width="6" stroke-linejoin="round" />
    <!-- Shaft -->
    <line x1="0" y1="5" x2="0" y2="75" stroke="#0C2340" stroke-width="6" stroke-linecap="round" />
    <!-- Handle -->
    <rect x="-7" y="75" width="14" height="60" rx="3" fill="#1E293B" />
    <line x1="-7" y1="90" x2="7" y2="90" stroke="#009B5D" stroke-width="2" />
    <line x1="-7" y1="105" x2="7" y2="105" stroke="#009B5D" stroke-width="2" />
    <line x1="-7" y1="120" x2="7" y2="120" stroke="#009B5D" stroke-width="2" />
    <!-- Shuttlecock -->
    <g transform="translate(65, -30) rotate(15)">
      <ellipse cx="0" cy="18" rx="8" ry="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
      <polygon points="-14,-8 14,-8 8,14 -8,14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="-5" y1="-8" x2="-3" y2="14" stroke="#CBD5E1" stroke-width="1" />
      <line x1="5" y1="-8" x2="3" y2="14" stroke="#CBD5E1" stroke-width="1" />
      <path d="M -11 2 Q 0 4 11 2" fill="none" stroke="#009B5D" stroke-width="1.5" />
    </g>
  </g>
  <text x="20" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0C2340" letter-spacing="1">YONEX NANORAY</text>
  <text x="380" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#009B5D" text-anchor="end">BADMINTON</text>
</svg>
